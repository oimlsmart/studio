name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The prebuild hook regenerates the model bundle when a smart
      # checkout is present (local devs); with none declared it keeps the
      # committed bundle. The freshness gate is the bundle-freshness job.
      - run: npm run build

      - name: Verify the page, the bundle, and the canonical logo asset
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/models/oiml-r60.prl
          grep -q '^package {' dist/models/oiml-r60.prl
          grep -q "https://www.oimlsmart.org/img/components/" dist/index.html
          url=$(grep -o 'https://www.oimlsmart.org/img/components/[a-z-]*-light.svg' dist/index.html | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "canonical logo: $url → HTTP $code"
          [ "$code" = "200" ]

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `astro preview` runs as a daemon by default. Use explicit --port
      # and --background so we know where it lands, and stop it via the
      # CLI rather than a captured PID (the wrapper exits immediately).
      - name: Start preview server
        run: npx astro preview --port 4322 --host --background

      - name: Wait for preview to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4322/studio/ > /dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not become ready"
          exit 1

      - name: Smoke-test /studio/edit
        run: node scripts/smoke-edit.mjs
        env:
          BASE_URL: http://localhost:4322

      - name: Smoke-test /studio/view (the read-only viewer)
        run: node scripts/smoke-view.mjs
        env:
          BASE_URL: http://localhost:4322

      - name: Stop preview
        if: always()
        run: npx astro preview stop || true

  bundle-freshness:
    # The SSOT freshness gate (the oimlsmart.github.io gates.yml
    # pattern): regenerates the model bundle from the PRIVATE
    # oimlsmart/smart repository and diffs it byte-identical against the
    # committed one. GitHub Actions can only check that repo out when a
    # PAT is configured:
    #
    #   1. create a fine-grained PAT with read access to oimlsmart/smart
    #   2. add it as secret  SMART_REPO_PAT
    #   3. set repo variable SMART_REPO_AVAILABLE = true
    #
    # Until then this job skips cleanly; the regeneration still runs
    # locally wherever both repos are checked out side by side
    # (node scripts/bundle-model.mjs, then commit the result).
    if: ${{ vars.SMART_REPO_AVAILABLE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell

      - name: Check out the smart repo (the PRL packages SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          path: vendor/smart
          token: ${{ secrets.SMART_REPO_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - name: Regenerate the bundle and diff byte-identical against the committed one
        run: |
          set -euo pipefail
          node scripts/bundle-model.mjs oiml-r60 "$RUNNER_TEMP/fresh-bundle.prl"
          diff -q "$RUNNER_TEMP/fresh-bundle.prl" public/models/oiml-r60.prl
        env:
          SMART_REPO: vendor/smart
