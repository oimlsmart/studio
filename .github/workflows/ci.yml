name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell

      # The model bundle regenerates at build time (scripts/bundle-model.mjs,
      # npm run prebuild) from the PRL packages SSOT — oimlsmart/smart is
      # private, so the checkout rides the org's read PAT (visibility: all).
      # main-tracking on purpose: the honest fix for the stale committed
      # bundle is "regenerate every build, never commit". The bundled
      # revision is logged by the bundler.
      - name: Checkout the smart repo (the PRL packages SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          path: vendor/smart
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build (the prebuild hook regenerates the model bundle)
        run: npm run build
        env:
          SMART_REPO: vendor/smart

      - name: Verify the page, the bundle, and the canonical logo asset
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/models/oiml-r60.prl
          grep -q '^package {' dist/models/oiml-r60.prl
          grep -q "https://www.oimlsmart.org/img/components/" dist/index.html
          url=$(grep -o 'https://www.oimlsmart.org/img/components/[a-z-]*-light.svg' dist/index.html | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "canonical logo: $url → HTTP $code"
          [ "$code" = "200" ]

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell

      - name: Checkout the smart repo (the PRL packages SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          path: vendor/smart
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build (the prebuild hook regenerates the model bundle)
        run: npm run build
        env:
          SMART_REPO: vendor/smart

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `astro preview` runs as a daemon by default. Use explicit --port
      # and --background so we know where it lands, and stop it via the
      # CLI rather than a captured PID (the wrapper exits immediately).
      - name: Start preview server
        run: npx astro preview --port 4322 --host --background

      - name: Wait for preview to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4322/studio/ > /dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not become ready"
          exit 1

      - name: Smoke-test /studio/edit
        run: node scripts/smoke-edit.mjs
        env:
          BASE_URL: http://localhost:4322

      - name: Smoke-test /studio/view (the read-only viewer)
        run: node scripts/smoke-view.mjs
        env:
          BASE_URL: http://localhost:4322

      - name: Stop preview
        if: always()
        run: npx astro preview stop || true
